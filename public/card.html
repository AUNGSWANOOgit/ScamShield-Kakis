  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1c1917;
      background: radial-gradient(120% 80% at 50% 0%, #ffffff 0%, #f5f5f4 55%, #ecebe9 100%);
    }
    .card {
      width: 100%; max-width: 24rem; padding: 2.25rem 1.5rem 1.5rem; border-radius: 1.75rem; background: #fff;
      box-shadow: 0 1px 2px rgba(28,25,23,.04), 0 12px 40px rgba(28,25,23,.08);
      animation: rise .5s ease-out both;
    }
    .chip {
      display: block; width: fit-content; margin: 0 auto; padding: .3rem .75rem; border-radius: 999px;
      background: #f5f5f4; color: #78716c; font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    }
    h1 { margin: .9rem 0 .25rem; text-align: center; font-size: 2.1rem; font-weight: 800; letter-spacing: -.02em; }
    p { margin: 0 0 1.75rem; text-align: center; color: #78716c; font-size: 1.05rem; }
    a {
      display: flex; align-items: center; gap: .9rem; margin-top: .75rem; padding: 1rem 1.1rem; border-radius: 1.1rem;
      text-decoration: none; font-size: 1.15rem; font-weight: 700; transition: transform .15s ease, box-shadow .15s ease;
    }
    a:active { transform: scale(.98); }
    a:focus-visible { outline: 3px solid #a8a29e; outline-offset: 3px; }
    .primary { background: #1c1917; color: #fff; box-shadow: 0 6px 18px rgba(28,25,23,.18); }
    .secondary { background: #fafaf9; color: #1c1917; border: 1.5px solid #e7e5e4; }
    .icon { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; flex: none; border-radius: .8rem; }
    .primary .icon { background: rgba(255,255,255,.12); }
    .secondary .icon { background: #fff; border: 1.5px solid #e7e5e4; }
    .label small { display: block; margin-top: .1rem; font-size: .85rem; font-weight: 500; opacity: .65; }
    .arrow { margin-left: auto; opacity: .45; font-size: 1.4rem; line-height: 1; }
    @media (hover: hover) { a:hover { transform: translateY(-1px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } a { transition: none; } }
  </style>
</head>
